name: build-windows-exe

# PyInstaller cannot cross-compile: a Windows .exe has to be built on
# Windows, and development here happens on Linux. This runner is therefore
# the only place the shipped artifact is produced.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Only needed to publish a GitHub Release on a tag push (softprops/
    # action-gh-release below); the default token wouldn't otherwise have
    # write access.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 3.10 is not arbitrary: cocoex (coco-experiment) is a compiled C
      # extension published as cp39-cp312 win_amd64 wheels, and this matches
      # the interpreter the app was developed and verified against.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-app.txt
          # mealpy declares numpy<=1.26.0, which conflicts with numpy==2.2.6
          # above and is not installed as part of that file for exactly this
          # reason - see the comment at the bottom of requirements-app.txt.
          pip install --no-deps mealpy==3.0.3

      - name: Confirm cocoex installed from a wheel, not a source build
        run: python -c "import cocoex; print('cocoex', cocoex.__file__)"

      - name: Build
        run: pyinstaller packaging/gui.spec --noconfirm

      # The checks that only fail once packaged: mealpy is discovered with
      # pkgutil.walk_packages (invisible to PyInstaller), opfunu's CEC suites
      # need ~1190 bundled data files, and cocoex is a C extension. Each
      # failure is silent in a build log and obvious here.
      - name: Self-test the built exe
        run: .\dist\OptimizerTrajectoryExplorer\OptimizerTrajectoryExplorer.exe --self-test

      - name: Report bundle size
        shell: bash
        run: du -sh dist/OptimizerTrajectoryExplorer

      # Kept for workflow_dispatch runs (no tag, so no release below) and
      # for grabbing a build without waiting on a release to be cut. Only
      # reachable from the Actions tab by someone with repo access, and
      # expires after 30 days - the release below is the durable, shareable
      # download.
      - uses: actions/upload-artifact@v4
        with:
          name: OptimizerTrajectoryExplorer-windows
          path: dist/OptimizerTrajectoryExplorer
          retention-days: 30

      # A tag push (v*) is the only trigger with a version to name a release
      # after, so the release step is skipped on a plain workflow_dispatch
      # run instead of publishing an unversioned one.
      - name: Zip the build for release
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path dist/OptimizerTrajectoryExplorer -DestinationPath OptimizerTrajectoryExplorer-windows.zip

      - name: Publish a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OptimizerTrajectoryExplorer-windows.zip
          generate_release_notes: true
